[package]
name = "gcsl"
description = "The GCSL language: lexer, parser, type checker and evaluator."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

[dependencies]
annotate-snippets = "0.12"
# Killing a program's process group, which std cannot do safely yet.
nix = { version = "0.31", default-features = false, features = ["signal"] }

[features]
# Runs plain evaluation on the machine too, as graph mode runs, so that the
# test suite checks the machine against the recursive walkers. For tests
# only: plain GCSL never pauses, so the walkers run it faster.
machine-everywhere = []

[lints]
workspace = true
