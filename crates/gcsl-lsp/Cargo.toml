[package]
name = "gcsl-lsp"
description = "A language server for GCSL that reports diagnostics and answers hovers and definitions."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
gcsl = { path = "../gcsl" }
gcsl-disk = { path = "../gcsl-disk" }
lsp-server = "0.10"
lsp-types = "0.97"
serde_json = "1.0"
# What `lsp-server`'s connection is made of: the server's main loop selects
# over it, its worker's channel and a timer.
crossbeam-channel = "0.5"

[lints]
workspace = true
