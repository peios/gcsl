name: GCSL build and tests

on:
    pull_request:
    push:
    workflow_dispatch:

permissions:
    contents: read

concurrency:
    group: gcsl-check-${{ github.ref }}
    cancel-in-progress: true

jobs:
    check:
        runs-on: ubuntu-24.04
        timeout-minutes: 60
        steps:
            - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
              with:
                  persist-credentials: false
            - name: Install Linux development tools
              run: |
                  sudo apt-get update
                  sudo apt-get install -y build-essential python3 python3-venv groff
                  rustup toolchain install 1.98.1 --profile minimal --component rustfmt --component clippy
            - name: Prepare pinned PSC style tools
              run: python3 tools/prepare-style-tools.py "$RUNNER_TEMP/gcsl-style"
            - name: Check style, lints and tests
              env:
                  PEIOS_STYLE_BIN: ${{ runner.temp }}/gcsl-style/bin
                  CARGO_TARGET_DIR: ${{ runner.temp }}/gcsl-cargo-checks
              run: tools/check
            - name: Build gcsl
              env:
                  CARGO_TARGET_DIR: ${{ runner.temp }}/gcsl-cargo-checks
              run: cargo +1.98.1 build --release --locked -p gcsl-cli
            - name: Build the pinned documentation compiler
              run: >-
                  cargo +1.98.1 install --locked --root "$RUNNER_TEMP/trail"
                  --git https://github.com/peios/trail
                  --rev 64517260afd150283bc1e2309d7c745f2728d467 trail
            - name: Check documentation
              run: >-
                  TRAIL="$RUNNER_TEMP/trail/bin/trail"
                  GCSL="$RUNNER_TEMP/gcsl-cargo-checks/release/gcsl"
                  tools/check-docs
