name: GCSL build and tests

on:
    pull_request:
    push:
    workflow_dispatch:

permissions:
    contents: read

concurrency:
    group: gcsl-check-${{ github.ref }}
    cancel-in-progress: true

jobs:
    check:
        runs-on: ubuntu-24.04
        timeout-minutes: 60
        steps:
            - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
              with:
                  persist-credentials: false
            - name: Install Linux development tools
              run: |
                  sudo apt-get update
                  sudo apt-get install -y build-essential python3 python3-venv binutils groff
                  rustup toolchain install 1.98.1 --profile minimal --component rustfmt --component clippy
            - name: Prepare pinned PSC style tools
              run: python3 tools/prepare-style-tools.py "$RUNNER_TEMP/gcsl-style"
            - name: Check style, build, tests and packages
              env:
                  PEIOS_STYLE_BIN: ${{ runner.temp }}/gcsl-style/bin
                  CARGO_TARGET_DIR: ${{ runner.temp }}/gcsl-cargo-checks
              run: tools/check
            - name: Check out the documentation compiler
              uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
              with:
                  repository: peios/trail
                  ref: 1d662e98cbcbdd5c51c01533afcab7f5723a2eff
                  path: .ci-tools/trail
                  persist-credentials: false
            - name: Build the pinned documentation compiler
              working-directory: .ci-tools/trail
              run: tools/bazel build //:trail
            - name: Check documentation
              env:
                  TRAIL: ${{ github.workspace }}/.ci-tools/trail/bazel-bin/trail
                  GCSL: ${{ github.workspace }}/bazel-bin/crates/gcsl-cli/gcsl
              run: tools/check-docs
